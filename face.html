<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gal Gadot 3D Model Viewer</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }
    header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.01em; }
    header .badge {
      font-size: 0.8rem;
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 4px 10px;
      border-radius: 9999px;
    }
    main {
      flex: 1;
      position: relative;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      outline: none;
    }
    .controls-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #94a3b8;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>Gal Gadot — 3D Face Reconstruction</h1>
    <span class="badge">glTF 2.0 (1.76 MB)</span>
  </header>
  <main>
    <model-viewer
      src="assets/gal_gadot.glb"
      alt="Gal Gadot 3D Face Model"
      camera-controls
      auto-rotate
      auto-rotate-delay="1000"
      rotation-per-second="20deg"
      shadow-intensity="1.2"
      shadow-softness="0.8"
      exposure="1.0"
      tone-mapping="neutral"
      camera-orbit="0deg 75deg 105%">
    </model-viewer>
    <div class="controls-hint">Drag to rotate • Scroll to zoom • Shift + drag to pan</div>
  </main>
</body>
</html>
